<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SV HaUI Helper</title>
    <link rel="stylesheet" href="./style.scss" />
  </head>
  <body>
    <header class="header">
      <div class="logo-title">
        <span class="icon">🎓</span>
        <div>
          <h1>SV HaUI Helper</h1>
          <span class="badge" id="app-version">v2.13.1</span>
        </div>
      </div>
      <a
        href="https://github.com/vuquan2005/svHaUI-Helper"
        target="_blank"
        class="github-link"
        title="Mã nguồn GitHub"
      >
        <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
          <path
            d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"
          />
        </svg>
      </a>
    </header>

    <main class="content">
      <!-- Upcoming Exam Card -->
      <section class="card exam-card" id="exam-section">
        <div class="card-header">
          <span class="card-title">⏰ Môn thi sắp tới</span>
          <span class="badge badge-accent" id="exam-countdown">Đang tải...</span>
        </div>
        <div class="exam-body" id="exam-body">
          <div class="exam-name" id="exam-course">Đang kiểm tra lịch thi...</div>
          <div class="exam-meta">
            <span id="exam-time"></span>
            <span id="exam-room"></span>
          </div>
        </div>
      </section>

      <!-- Quick Nav Hub -->
      <section class="section">
        <div class="section-title">🚀 Truy cập nhanh HaUI</div>
        <div class="quick-nav-grid">
          <button class="nav-btn" data-url="https://sv.haui.edu.vn/timestable/calendarcl">
            <span class="nav-icon">📅</span>
            <span class="nav-text">Thời khóa biểu</span>
          </button>
          <button
            class="nav-btn"
            data-url="https://sv.haui.edu.vn/student/schedulefees/transactionmodules"
          >
            <span class="nav-icon">📝</span>
            <span class="nav-text">Lịch thi</span>
          </button>
          <button class="nav-btn" data-url="https://sv.haui.edu.vn/student/result/studyresults">
            <span class="nav-icon">📊</span>
            <span class="nav-text">Bảng điểm</span>
          </button>
          <button class="nav-btn" data-url="https://sv.haui.edu.vn/student/recharge/cashinqr">
            <span class="nav-icon">💳</span>
            <span class="nav-text">Nạp tiền QR</span>
          </button>
        </div>
      </section>

      <!-- Feature Switches -->
      <section class="section">
        <div class="section-title">⚙️ Tính năng hỗ trợ</div>
        <div class="toggles-list" id="toggles-list">
          <!-- Injected via main.ts -->
        </div>
      </section>
    </main>

    <footer class="footer">
      <span>Phát triển bởi <strong>VuQuan</strong></span>
      <button class="donate-btn" id="donate-btn">Ủng hộ ☕</button>
    </footer>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
